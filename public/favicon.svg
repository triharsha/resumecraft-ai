<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- ResumeCraft AI favicon -->

  <defs>
    <linearGradient
      id="resumeGradient"
      x1="8"
      y1="8"
      x2="56"
      y2="56"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0%"
        stop-color="#7c3aed"
      />
      <stop
        offset="100%"
        stop-color="#4f46e5"
      />

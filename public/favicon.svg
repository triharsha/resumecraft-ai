  />

  <path
    d="M19.5 38
       C20.5 33.8 23 32 25 32
       C27 32 29.5 33.8 30.5 38"
    fill="#7c3aed"
  />

  <!-- Resume lines -->
  <rect
    x="34"
    y="29"
    width="8"
    height="2.5"
    rx="1.25"
    fill="#7c3aed"
  />

  <rect
    x="34"
    y="35"
    width="8"
    height="2.5"
    rx="1.25"
    fill="#a78bfa"
  />

  <rect
    x="20"
    y="43"
    width="22"
    height="2.5"
    rx="1.25"
    fill="#c4b5fd"
  />

  <!-- AI sparkle -->
  <path
    d="M49 8
       L51.1 13.9
       L57 16
       L51.1 18.1
       L49 24
       L46.9 18.1
       L41 16
       L46.9 13.9Z"

  </defs>

  <!-- Background -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="14"
    fill="url(#resumeGradient)"
  />

  <!-- Resume document -->
  <path
    d="M19 14
       H38
       L47 23
       V49
       C47 51.2 45.2 53 43 53
       H19
       C16.8 53 15 51.2 15 49
       V18
       C15 15.8 16.8 14 19 14Z"
